# Intentionally a no-op pipeline definition.
#
# This repo is deployed via Cloudflare Pages' native GitLab git integration
# (CF Pages fetches main on push and runs the build inside its own runner).
# There is no work for GitLab CI to do here — but GitLab/Auto-DevOps was
# auto-creating a pipeline on every push, which surfaced as a constantly
# "running"/failing job in the project dashboard.
#
# `workflow.rules` with a single `when: never` rule tells GitLab to skip
# pipeline creation entirely. No jobs, no runner minutes, no red badges.
#
# If we ever want CI back (lint, typecheck, etc.), replace this file with
# real stages + jobs and the workflow rule will be overridden.

workflow:
  rules:
    - when: never
